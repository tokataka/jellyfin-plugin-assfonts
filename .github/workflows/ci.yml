name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version_bumped: ${{ steps.version.outputs.version_bumped }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Build plugin and test assemblies once
        run: dotnet build tests/AssFonts.Tests.csproj -c Release --nologo
      - name: Test distribution
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Package the same plugin binary used by the tests
        run: |
          cmp src/bin/Release/net10.0/Jellyfin.Plugin.AssFonts.dll tests/bin/Release/net10.0/Jellyfin.Plugin.AssFonts.dll
          python3 package.py
      - name: Detect a version increase across the push
        id: version
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: echo "version_bumped=$(python3 scripts/distribution.py version-bumped --before "$BEFORE")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-suite
          path: tests/bin/Release/net10.0/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-package
          path: artifacts/ASS-Fonts_*.zip
          if-no-files-found: error
          retention-days: 14

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: test-suite
          path: test-suite
      - name: Run the Release assemblies without rebuilding
        run: dotnet test test-suite/AssFonts.Tests.dll --logger "trx;LogFileName=tests.trx" --results-directory test-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-${{ matrix.runner }}
          path: test-results/
          retention-days: 7

  publish:
    needs: [build, test]
    if: >-
      github.repository == 'tokataka/jellyfin-plugin-assfonts' && github.ref == 'refs/heads/main' &&
      github.event_name == 'push' && needs.build.outputs.version_bumped == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-jellyfin-plugin-index
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: plugin-package
          path: artifacts
      - name: Check out the plugin index with its dedicated deploy key
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: tokataka/jellyfin-plugin-repository
          ref: main
          path: plugin-index
          ssh-key: ${{ secrets.INDEX_DEPLOY_KEY }}
      - name: Check index access before publishing
        run: git -C plugin-index push --dry-run origin HEAD:main
      - name: Publish new version or reuse the existing release
        run: bash scripts/publish-release.sh
      - name: Update catalog and push
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/distribution.py version)"
          python3 scripts/distribution.py index \
            --zip "artifacts/published/ASS-Fonts_${version}.zip" \
            --repository "$GITHUB_REPOSITORY" \
            --release artifacts/release.json \
            --manifest plugin-index/manifest.json
          cd plugin-index
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- manifest.json; then
            echo 'Catalog already contains this release.'
          else
            git add manifest.json
            git commit -m "Publish ASS Fonts ${version}"
            git push origin HEAD:main
          fi
