name: Release

on:
  push:
    branches: [main]
    paths: [Directory.Build.props]
  workflow_dispatch:
    inputs:
      replace_existing_release:
        description: Replace the current release after resetting its catalog entry
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Test distribution
        if: matrix.runner == 'ubuntu-24.04'
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test and build plugin
        run: dotnet test tests/AssFonts.Tests.csproj -c Release --nologo
      - name: Package
        if: matrix.runner == 'ubuntu-24.04'
        run: python3 package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.runner == 'ubuntu-24.04'
        with:
          name: plugin-package
          path: artifacts/ASS-Fonts_*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.repository == 'tokataka/jellyfin-plugin-assfonts' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-jellyfin-plugin-index
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPLACE_EXISTING_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_existing_release && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: plugin-package
          path: artifacts
      - name: Check out the plugin index with its dedicated deploy key
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: tokataka/jellyfin-plugin-repository
          ref: main
          path: plugin-index
          ssh-key: ${{ secrets.INDEX_DEPLOY_KEY }}
      - name: Check index access before publishing
        run: git -C plugin-index push --dry-run origin HEAD:main
      - name: Publish new version or reuse the existing release
        run: bash scripts/publish-release.sh
      - name: Update catalog and push
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/distribution.py version)"
          python3 scripts/distribution.py index \
            --zip "artifacts/published/ASS-Fonts_${version}.zip" \
            --repository "$GITHUB_REPOSITORY" \
            --release artifacts/release.json \
            --manifest plugin-index/manifest.json
          cd plugin-index
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- manifest.json; then
            echo 'Catalog already contains this release.'
          else
            git add manifest.json
            git commit -m "Publish ASS Fonts ${version}"
            git push origin HEAD:main
          fi
